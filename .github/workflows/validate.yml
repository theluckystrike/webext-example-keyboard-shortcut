name: Validate

on: [push, pull_request]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Validate
        run: |
          python3 -m json.tool src/manifest.json > /dev/null
          echo "✓ Valid"
